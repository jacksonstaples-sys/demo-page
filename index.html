<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333333;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
        }

        .page-image {
            width: 100%;
            max-width: 400px;
            height: auto;
            display: block;
            margin: 20px auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        p {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* Styling for links */
        a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
            color: #2980b9;
        }
    </style>
</head>
<body>

    <h1>Welcome to Web Development Class</h1>

    <!-- Image element -->
    <img src="Golfcourseshot.jpg" alt="Golf course shot" class="page-image">

    <p>This is my very first webpage built for class using GitHub Pages! I am learning how HTML structures content on the web and how to publish updates directly through GitHub.</p>

    <!-- Clickable Link Paragraph -->
    <p>Check out one of my favorite websites: <a href="https://www.pgatour.com" target="_blank" rel="noopener noreferrer">Visit PGA Tour</a></p>

</body>
</html>
